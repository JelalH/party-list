<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}
  body.light{background:#ececef;color:#111113}
  body.dark{background:#0d0d0f;color:#f4f4f5}
  h1{margin:0;white-space:nowrap;font-weight:800;letter-spacing:-.035em;text-align:center;line-height:1.06}
  p{margin:0;font-weight:500;text-align:center;opacity:.6;line-height:1.3}
  .dev{overflow:hidden;flex:none}
  .dev img{width:100%;display:block}
</style></head>
<body>
  <h1 id="h"></h1><p id="s"></p>
  <div class="dev" id="dev"><img id="img" alt=""></div>
<script>
  // App Store frame: caption on top, the app inside a phone or tablet outline.
  // ?w=&ht= (canvas size) &device=phone|tablet &theme= &h= (headline) &s= (subline) &img=
  const q = new URLSearchParams(location.search);
  const W = +q.get('w'), H = +q.get('ht'), tablet = q.get('device') === 'tablet', dark = q.get('theme') === 'dark';
  document.body.className = dark ? 'dark' : 'light';
  Object.assign(document.body.style, { width: W + 'px', height: H + 'px', paddingTop: Math.round(H * .055) + 'px' });
  const f = Math.min(W * .068, H * .034);
  const h = document.getElementById('h'), s = document.getElementById('s'), dev = document.getElementById('dev');
  h.textContent = q.get('h'); h.style.fontSize = f + 'px';
  s.textContent = q.get('s'); Object.assign(s.style, { fontSize: f * .54 + 'px', marginTop: f * .38 + 'px', padding: `0 ${W * .08}px` });
  dev.style.marginTop = H * .04 + 'px';
  const img = document.getElementById('img');
  img.onload = () => {
    // size the device so it fills the space under the caption, leaving a small margin at the bottom
    const room = H - dev.offsetTop - H * .03;
    const dw = Math.min(W * .86, room * img.naturalWidth / img.naturalHeight), ring = dw * (tablet ? .012 : .017);
    Object.assign(dev.style, { width: dw + 'px', borderRadius: dw * (tablet ? .035 : .075) + 'px',
      boxShadow: `0 ${dw * .03}px ${dw * .08}px rgba(0,0,0,${dark ? .6 : .18}),0 0 0 ${ring}px ${dark ? '#2a2a30' : '#1b1b1f'}` });
  };
  img.src = q.get('img');
</script>
</body></html>

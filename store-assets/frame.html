<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding-top:120px}
  body.light{background:#ececef;color:#111113}
  body.dark{background:#0d0d0f;color:#f4f4f5}
  h1{margin:0 60px;white-space:nowrap;font-size:74px;line-height:1.06;font-weight:800;letter-spacing:-.035em;text-align:center}
  p{margin:28px 90px 0;font-size:40px;line-height:1.3;font-weight:500;text-align:center;opacity:.6}
  .phone{position:absolute;top:390px;width:820px;height:1458px;border-radius:64px;overflow:hidden;flex:none;
         box-shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 14px #1b1b1f}
  body.dark .phone{box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 14px #2a2a30}
  .phone img{width:100%;display:block}
</style></head>
<body>
  <h1 id="h"></h1><p id="s"></p>
  <div class="phone"><img id="img" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('theme') || 'light';
  document.getElementById('h').textContent = q.get('h');
  document.getElementById('s').textContent = q.get('s');
  document.getElementById('img').src = q.get('img');
</script>
</body></html>
